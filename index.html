<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BrainsMakeWaves</title>
<link rel="icon" href="duck_pro.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&amp;family=JetBrains+Mono:wght@400;600;800&amp;display=swap">
<style>
body{margin:0;background:#0B0E13}
</style>
</head>
<body>
<section style="position: relative; min-height: 100vh; overflow: hidden; background: #0B0E13; color: #F2F1EA; display: flex; align-items: center; justify-content: center">
<canvas id="bmw-waves" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block"></canvas>
<main style="position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 48px 24px; text-align: center">
<div id="bmw-duck-box" style="display: flex; align-items: center; justify-content: center">
<img id="bmw-duck" src="duck_pro.svg" alt="The BrainsMakeWaves rubber duck in a paper hat" style="width: clamp(200px, 34vmin, 360px); height: auto; filter: drop-shadow(0 16px 26px rgba(0,0,0,0.45))">
</div>
<h1 id="bmw-title" style="margin: 0; font-family: 'Bricolage Grotesque', 'Segoe UI', system-ui, sans-serif; font-size: clamp(32px, 5.2vw, 60px); font-weight: 800; letter-spacing: -0.03em; line-height: 1.1">BrainsMakeWaves</h1>
</main>
<canvas id="bmw-waves-front" aria-hidden="true" style="position: absolute; inset: 0; width: 100%; height: 100%; display: block; z-index: 3; pointer-events: none"></canvas>
</section>
<script>
// BrainsMakeWaves splash screen: brainwave background + floating duck.
// All settings (colors, speeds, sizes) are at the top of _start() below.
(function () {
  class DCLogic { constructor() { this.props = {}; } }

  class Component extends DCLogic {
    renderVals() {
      if (!this._refs) {
        this._refs = {
          setCanvas: (el) => {
            if (el && el !== this._cv) { this._cv = el; this._start(); }
            if (!el) { this._stop(); this._cv = null; }
          },
          setFg: (el) => { this._fg = el || null; },
          setDuck: (el) => { this._duck = el || null; },
          setDuckImg: (el) => { this._duckImg = el || null; },
          setTitle: (el) => { this._title = el || null; }
        };
      }
      return this._refs;
    }

    componentWillUnmount() { this._stop(); }

    _stop() {
      if (this._raf) cancelAnimationFrame(this._raf);
      this._raf = 0;
      if (this._ro) { this._ro.disconnect(); this._ro = null; }
      if (this._io) { this._io.disconnect(); this._io = null; }
    }

    _start() {
      this._stop();
      const cv = this._cv;
      const ctx = cv.getContext('2d');

      // ================= settings =================
      const WAVE_RGB = [255, 212, 0];        // #FFD400
      const WAVE_SPEED = 1.2;                // brainwave animation speed
      const DUCK_SPEED = 2.2;                // duck bob speed
      const DUCK_AMPLITUDE = 1;              // duck bob size
      const DUCK_PERIOD = 7;                 // seconds per bob at speed 1
      const ROWS = 20, COLS = 96, FG_ROWS = 3;
      const FPS = 30, MAX_DPR = 1.5;
      const BG = '#0B0E13';
      const GLYPHS = '01';
      const LABELS = ['Fp1', 'Fp2', 'F7', 'F3', 'Fz', 'F4', 'F8', 'T3', 'C3', 'Cz', 'C4', 'T4', 'T5', 'P3', 'Pz', 'P4', 'T6', 'O1', 'Oz', 'O2'];

      const TAU = Math.PI * 2, NG = GLYPHS.length;
      const reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const rnd = (a, b) => a + Math.random() * (b - a);
      const randGlyph = () => (Math.random() * NG) | 0;
      const WAVE = WAVE_RGB.join(',');
      const BRIGHT = [255, 250, 235].map((w, i) => (WAVE_RGB[i] + (w - WAVE_RGB[i]) * 0.85) | 0).join(',');

      // ================= the signal: 20 channels of brainwave-like activity =================
      const bands = [                        // spatial frequency, temporal speed, amplitude
        { f: 0.011, w: 1.1, a: 0.50 },       // delta
        { f: 0.024, w: 2.3, a: 0.34 },       // theta
        { f: 0.052, w: 5.2, a: 0.62 },       // alpha
        { f: 0.115, w: 8.5, a: 0.09 },       // beta
        { f: 0.210, w: 13.0, a: 0.025 }      // gamma
      ];
      const NB = bands.length;
      const chans = Array.from({ length: ROWS }, () => ({
        ph: bands.map(() => rnd(0, TAU)),
        fm: bands.map(() => rnd(0.65, 1.45)),
        am: bands.map(() => rnd(0.35, 1.6)),
        wm: bands.map(() => rnd(0.6, 1.5)),
        st: bands.map(() => Math.random() < 0.35),   // standing (breathing) vs drifting left
        sm: rnd(0.4, 1.8), so: rnd(0, TAU),
        noise: rnd(0.03, 0.1),
        zj: rnd(-0.38, 0.38),                        // uneven spacing in depth
        bursts: [],
        jit: new Float32Array(COLS),
        g: Uint8Array.from({ length: COLS }, randGlyph)
      }));
      const vals = Array.from({ length: ROWS }, () => new Float32Array(COLS));
      let spikes = [], t = 0;

      const update = (dt) => {
        t += dt;
        const live = dt > 0;
        if (live && Math.random() < dt * 0.12) spikes.push({
          c: rnd(10, COLS - 10), age: 0,
          lag: chans.map(() => rnd(0, 0.9)),
          amp: chans.map(() => (Math.random() < 0.35 ? 0 : rnd(0.6, 1.8) * (Math.random() < 0.25 ? -1 : 1)))
        });
        for (const sp of spikes) sp.age += dt;
        spikes = spikes.filter((sp) => sp.age < 4.5);
        const slow = t * 0.12, drift = t * 0.9;
        for (let r = 0; r < ROWS; r++) {
          const ch = chans[r], out = vals[r];
          if (live && Math.random() < dt * 0.15) ch.bursts.push({ c: rnd(0, COLS), w: rnd(10, 22), f: rnd(0.05, 0.11), a: rnd(0.5, 1.0), age: 0, life: rnd(2.0, 4.0), p: rnd(0, TAU), sp: rnd(1.5, 3.5) });
          for (const bu of ch.bursts) bu.age += dt;
          ch.bursts = ch.bursts.filter((bu) => bu.age < bu.life);
          const envA = [], amp = [], kf = [], wt = [];
          for (let bi = 0; bi < NB; bi++) {
            envA[bi] = slow * ch.sm * (0.7 + bi * 0.37) + ch.so + bi;
            amp[bi] = bands[bi].a * ch.am[bi];
            kf[bi] = TAU * bands[bi].f * ch.fm[bi];
            wt[bi] = bands[bi].w * ch.wm[bi] * t * 0.1;
          }
          for (let c = 0; c < COLS; c++) {
            const cd = c + drift;                       // gentle right-to-left drift
            let y = 0;
            for (let bi = 0; bi < NB; bi++) {
              const env = 0.5 + 0.5 * Math.sin(envA[bi] + cd * 0.02 * (bi + 1));
              const kx = kf[bi] * cd + ch.ph[bi];
              y += amp[bi] * env * (ch.st[bi] ? Math.sin(kx) * (0.6 + 0.4 * Math.sin(wt[bi])) : Math.sin(kx + wt[bi]));
            }
            for (const bu of ch.bursts) {               // local spindles
              const d = (c - bu.c) / bu.w;
              if (d > -3 && d < 3) y += bu.a * Math.sin(Math.PI * bu.age / bu.life) * Math.exp(-d * d) * Math.sin(TAU * bu.f * c + bu.p + bu.sp * bu.age);
            }
            for (const sp of spikes) {                  // spike-and-wave events
              const a = sp.amp[r], s = sp.age - sp.lag[r], d = c - sp.c;
              if (!a || s <= 0 || d < -20 || d > 20) continue;
              const rise = Math.min(1, s * 1.5);
              y += 1.15 * a * Math.exp(-d * d / 40) * Math.sin(d * 0.22 + 0.6) * Math.exp(-s * 0.9) * rise * rise * (3 - 2 * rise);
            }
            if (live) ch.jit[c] = ch.jit[c] * 0.92 + (Math.random() - 0.5) * ch.noise * 0.3;
            out[c] = Math.max(-1.35, Math.min(1.35, (y + ch.jit[c]) / 1.15));
          }
          for (let pass = 0; pass < 2; pass++) {        // soften the trace
            let prev = out[0];
            for (let c = 1; c < COLS - 1; c++) { const cur = out[c]; out[c] = 0.25 * prev + 0.5 * cur + 0.25 * out[c + 1]; prev = cur; }
          }
          if (live) for (let c = 0; c < COLS; c++) if (Math.random() < 0.006) ch.g[c] = randGlyph();
        }
      };

      // ================= pre-rendered character sheets (one per size and style) =================
      let sheets = {};
      const sheet = (px, style) => {                     // style: 'w' wave, 'b' bright crest, 'm' mist
        const key = px + style;
        if (sheets[key]) return sheets[key];
        const cell = Math.ceil(px * 1.5);
        const c = document.createElement('canvas');
        c.width = cell * NG; c.height = cell;
        const g = c.getContext('2d');
        g.font = (style === 'm' ? '800 ' : '600 ') + px + 'px "JetBrains Mono", ui-monospace, monospace';
        g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = 'rgb(' + (style === 'b' ? BRIGHT : WAVE) + ')';
        if (style === 'm') { g.strokeStyle = g.fillStyle; g.lineWidth = Math.max(0.9, px * 0.11); g.lineJoin = 'round'; }
        for (let i = 0; i < NG; i++) {
          g.fillText(GLYPHS[i], i * cell + cell / 2, cell / 2 + 1);
          if (style === 'm') g.strokeText(GLYPHS[i], i * cell + cell / 2, cell / 2 + 1);
        }
        return (sheets[key] = { c, cell });
      };
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { sheets = {}; });

      // ================= layout: recomputed on resize =================
      let W = 1, H = 1, dpr = 1, wide = true, cx = 0, rowsGeo = [];
      let mx = 0, my = 0, mr = 1;                       // circle around the duck where the front waves pass over it
      let tx = 0, ty = 0, trx = 1, tRy = 1;             // quiet zone behind the name
      const measure = () => {
        const cr = cv.getBoundingClientRect();
        const d = this._duck && this._duck.getBoundingClientRect();
        if (d && d.width) { mx = d.left - cr.left + d.width / 2; my = d.top - cr.top + d.height * 0.58; mr = d.width * 0.56; }
        else { mx = W / 2; my = H * 0.42; mr = Math.min(W, H) * 0.18; }
        const tt = this._title && this._title.getBoundingClientRect();
        if (tt && tt.width) { tx = tt.left - cr.left + tt.width / 2; ty = tt.top - cr.top + tt.height / 2; trx = tt.width * 0.75; tRy = tt.height * 1.3; }
        else { tx = W / 2; ty = H * 0.7; trx = W * 0.25; tRy = 60; }
      };
      const duckMask = (x, y) => {                      // 1 inside the duck circle, fading to 0 at its edge
        const dx = x - mx, dy = y - my, d = Math.sqrt(dx * dx + dy * dy) / mr;
        return d >= 1 ? 0 : d <= 0.62 ? 1 : (1 - d) / 0.38;
      };
      const resize = () => {
        const rect = cv.getBoundingClientRect();
        dpr = Math.min(window.devicePixelRatio || 1, MAX_DPR);
        W = Math.max(1, rect.width); H = Math.max(1, rect.height);
        cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
        wide = W >= 860;
        cx = W * 0.5;
        const horizon = H * 0.30, front = H * 0.70;
        const spanFront = W * (wide ? 1.25 : 1.7), ampFront = H * (wide ? 0.15 : 0.12);
        measure();
        rowsGeo = chans.map((ch, r) => {
          const z = Math.min(0.99, Math.max(0, (r + ch.zj) / ROWS));
          const sc = 1 / (1 + z * 2.2);
          const span = spanFront * sc;
          const xs = new Float32Array(COLS);
          for (let c = 0; c < COLS; c++) xs[c] = cx + (c / (COLS - 1) - 0.5) * span;
          return {
            z, sc, xs, span,
            base: horizon + (front - horizon) * sc,
            amp: ampFront * sc,
            depthA: Math.pow(1 - z * 0.92, 1.3),
            px: Math.max(7, Math.round(16 * sc)),        // wave character size
            mpx: Math.max(6, Math.round(12.5 * sc)),     // mist character size
            strands: Math.round(3 + 10 * (1 - z) * (1 - z) + 2 * (1 - z))
          };
        });
      };
      let dirty = true;
      this._ro = new ResizeObserver(() => { resize(); dirty = true; });
      this._ro.observe(cv);
      resize();

      let onScreen = true;                              // pause while scrolled out of view
      if ('IntersectionObserver' in window) {
        this._io = new IntersectionObserver((es) => { onScreen = es[0] ? es[0].isIntersecting : true; });
        this._io.observe(cv);
      }

      // ================= drawing one channel on one layer =================
      const ys = new Float32Array(COLS);
      const rib = new Float32Array(COLS), ripS = new Float32Array(COLS), ripC = new Float32Array(COLS);
      const drawRow = (L, r, fgLayer) => {
        const geo = rowsGeo[r], v = vals[r], g = chans[r].g;
        const { xs, base, amp, depthA } = geo;
        const split = r < FG_ROWS;                     // nearest channels pass in front of the duck
        const weight = (x, y) => (!split ? 1 : fgLayer ? duckMask(x, y) : 1 - duckMask(x, y));
        for (let c = 0; c < COLS; c++) ys[c] = base - v[c] * amp;

        // what lies under this line hides the channels behind it
        L.beginPath();
        L.moveTo(xs[0], base + amp * 1.4);
        for (let c = 0; c < COLS; c++) L.lineTo(xs[c], ys[c]);
        L.lineTo(xs[COLS - 1], base + amp * 1.4);
        L.closePath();
        if (fgLayer) {
          const gr = L.createRadialGradient(mx, my, mr * 0.62, mx, my, mr);
          gr.addColorStop(0, 'rgba(11,14,19,0.9)'); gr.addColorStop(1, 'rgba(11,14,19,0)');
          L.fillStyle = gr;
        } else L.fillStyle = BG;
        L.fill();

        // mist: ribbons of faint binary strings that fan out and twist around the line
        const ms = sheet(geo.mpx, 'm'), mcell = ms.cell, mhalf = mcell / 2;
        const ribPhase = t * 0.3 + r * 0.9, ribSpread = t * 0.25 + r * 1.7, ribRipple = t * 0.5;
        for (let c = 0; c < COLS; c++) {
          rib[c] = (0.55 + 1.05 * (0.5 + 0.5 * Math.sin(0.03 * c + ribSpread))) * Math.cos(0.035 * c + ribPhase);
          ripS[c] = Math.sin(0.08 * c + ribRipple); ripC[c] = Math.cos(0.08 * c + ribRipple);
        }
        const step = geo.z > 0.45 ? 3 : 2;
        const NS = geo.strands, sAlpha = (fgLayer ? 0.42 : 0.32) * depthA, flick = Math.floor(t * 0.6);
        L.globalCompositeOperation = 'lighter';
        for (let k = 0; k < NS; k++) {
          const kk = NS > 1 ? k / (NS - 1) : 0.5;
          const edge = sAlpha * (0.35 + 0.65 * Math.sin(Math.PI * kk));   // outer strands fainter
          const sk = Math.sin(k * 0.7), ck = Math.cos(k * 0.7);
          for (let c = k % step; c < COLS; c += step) {
            const off = 0.18 + rib[c] * (kk - 0.35) + 0.08 * (ripS[c] * ck + ripC[c] * sk);
            const my_ = ys[c] + off * amp;
            const a = edge * weight(xs[c], my_);
            if (a < 0.006) continue;
            let h = Math.imul(r + 1, 374761393) ^ Math.imul(k + 7, 668265263) ^ Math.imul(c + 13, 1274126177) ^ Math.imul(((flick + k * 3 + c) % 5 === 0 ? flick : 0) + 3, 1103515245);
            h = Math.imul(h ^ (h >>> 15), 2246822519); h ^= h >>> 13;   // scrambled digit choice
            L.globalAlpha = a;
            L.drawImage(ms.c, ((h >>> 0) % NG) * mcell, 0, mcell, mcell, (xs[c] - mhalf) | 0, (my_ - mhalf) | 0, mcell, mcell);
          }
        }
        L.globalCompositeOperation = 'source-over';

        // faint trace line
        if (!fgLayer) {
          L.globalAlpha = 1;
          L.beginPath();
          for (let c = 0; c < COLS; c++) (c ? L.lineTo(xs[c], ys[c]) : L.moveTo(xs[c], ys[c]));
          L.strokeStyle = 'rgba(' + WAVE + ',' + (0.14 * depthA).toFixed(3) + ')';
          L.lineWidth = Math.max(0.6, 1.4 * geo.sc);
          L.stroke();
        }

        // the characters riding the wave; crests glow toward white
        const s1 = sheet(geo.px, 'w'), s2 = sheet(geo.px, 'b'), cell = s1.cell, half = cell / 2;
        for (let c = 0; c < COLS; c++) {
          const w = weight(xs[c], ys[c]);
          if (w <= 0.002) continue;
          const vv = v[c], e = Math.min(1, Math.abs(vv));
          const a = (0.18 + 0.82 * Math.pow(e, 1.2)) * depthA * w;
          const k = vv > 0.6 ? Math.min(1, (vv - 0.6) / 0.5) : 0;
          const dx = (xs[c] - half) | 0, dy = (ys[c] - half) | 0, sx = g[c] * cell;
          if (k < 1) { L.globalAlpha = a * (1 - k); L.drawImage(s1.c, sx, 0, cell, cell, dx, dy, cell, cell); }
          if (k > 0) { L.globalAlpha = a * k; L.drawImage(s2.c, sx, 0, cell, cell, dx, dy, cell, cell); }
        }
        L.globalAlpha = 1;

        if (!fgLayer && wide && r % 3 === 0) {          // electrode labels
          L.font = '400 ' + Math.max(9, 11 * geo.sc).toFixed(1) + 'px "JetBrains Mono", ui-monospace, monospace';
          L.textAlign = 'left'; L.textBaseline = 'middle';
          L.fillStyle = 'rgba(200,204,212,' + (0.45 * depthA).toFixed(3) + ')';
          L.fillText(LABELS[r % LABELS.length], Math.min(W - 44, cx + geo.span * 0.5 + 10), base);
        }
      };

      // ================= the loop =================
      let duckLast = performance.now(), duckPhase = 0;
      let last = performance.now(), lastDraw = -1e9, lastMeasure = -1e9;
      const frame = (now) => {
        this._raf = requestAnimationFrame(frame);

        // the duck bobs and tilts on every display frame
        const dd = Math.min(0.1, (now - duckLast) / 1000); duckLast = now;
        duckPhase += dd * DUCK_SPEED * TAU / DUCK_PERIOD;
        const img = this._duckImg;
        if (img) {
          const da = reduce ? 0 : DUCK_AMPLITUDE, sn = Math.sin(duckPhase), cs = Math.cos(duckPhase);
          img.style.transform = 'translate(' + (10 * sn * da).toFixed(2) + 'px,' + (-11 * (1 - cs) * da).toFixed(2) + 'px) rotate(' + ((-4 * cs + 0.5 * sn) * da).toFixed(2) + 'deg)';
        }

        if (!onScreen) { last = now; return; }
        if (now - lastDraw < 1000 / FPS - 2 && !dirty) return;   // waves at 30 fps
        lastDraw = now; dirty = false;
        const dt = Math.min(0.1, (now - last) / 1000) * (reduce ? 0 : WAVE_SPEED);
        last = now;
        update(dt);
        if (now - lastMeasure > 1000) { measure(); lastMeasure = now; }

        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.globalAlpha = 1;
        ctx.fillStyle = BG;
        ctx.fillRect(0, 0, W, H);
        for (let r = ROWS - 1; r >= 0; r--) drawRow(ctx, r, false);

        // quiet zone so the name stays readable
        ctx.save();
        ctx.translate(tx, ty);
        ctx.scale(1, tRy / trx);
        const halo = ctx.createRadialGradient(0, 0, 0, 0, 0, trx);
        halo.addColorStop(0, 'rgba(11,14,19,0.88)'); halo.addColorStop(0.6, 'rgba(11,14,19,0.6)'); halo.addColorStop(1, 'rgba(11,14,19,0)');
        ctx.fillStyle = halo;
        ctx.fillRect(-trx, -trx, trx * 2, trx * 2);
        ctx.restore();

        // the nearest channels again, on the layer above the duck
        const fgc = this._fg;
        if (fgc) {
          if (fgc.width !== cv.width || fgc.height !== cv.height) { fgc.width = cv.width; fgc.height = cv.height; }
          const f = fgc.getContext('2d');
          f.setTransform(1, 0, 0, 1, 0, 0);
          f.clearRect(0, 0, fgc.width, fgc.height);
          f.setTransform(dpr, 0, 0, dpr, 0, 0);
          for (let r = FG_ROWS - 1; r >= 0; r--) drawRow(f, r, true);
        }

        // live indicator
        const pulse = reduce ? 1 : 0.55 + 0.45 * Math.sin(now * 0.006);
        const lx = W - (wide ? 150 : 120), ly = H - 26;
        ctx.beginPath();
        ctx.arc(lx, ly, 4.5, 0, TAU);
        ctx.fillStyle = 'rgba(255,107,0,' + pulse.toFixed(3) + ')';
        ctx.fill();
        ctx.font = '600 11px "JetBrains Mono", ui-monospace, monospace';
        ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
        ctx.fillStyle = 'rgba(200,204,212,0.7)';
        ctx.fillText('LIVE · ' + ROWS + ' CH', lx + 12, ly + 0.5);
      };
      this._raf = requestAnimationFrame(frame);
    }
  }

  const splash = new Component();
  const refs = splash.renderVals();
  refs.setFg(document.getElementById('bmw-waves-front'));
  refs.setDuck(document.getElementById('bmw-duck-box'));
  refs.setDuckImg(document.getElementById('bmw-duck'));
  refs.setTitle(document.getElementById('bmw-title'));
  refs.setCanvas(document.getElementById('bmw-waves'));   // last: this starts the animation
})();
</script>
</body>
</html>
